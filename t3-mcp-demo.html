<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T3 Code MCP demo</title>
  <style>
    body { font: 18px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 12vh auto; padding: 0 1.5rem; color: #172b3a; background: #f6f8fa; }
    h1 { font-size: 2rem; margin-bottom: .5rem; }
    button { border: 0; border-radius: .4rem; padding: .7rem 1rem; background: #175cd3; color: white; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #172b3a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>T3 Code MCP demo</h1>
    <p>This page lives on an isolated Git worktree branch. The original checkout stays untouched.</p>
    <button type="button" id="check">Test interaction</button>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <script>
    document.querySelector('#check').addEventListener('click', () => {
      document.querySelector('#result').textContent = 'The local preview is working.';
    });
  </script>
</body>
</html>
